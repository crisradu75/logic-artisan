name: tests

# Until this existed, "all scopes pass" meant one developer's machine at one
# moment. Every guard hook in this repo shells out to real git, and several
# behave differently on Windows and POSIX (path separators, the mangled-path
# shapes warn-stray-scratch-artifact parses), so the matrix below runs both
# rather than trusting that one implies the other.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The plugin is stdlib-only by design; pytest is the single dev dep.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # Hooks call `git` directly and several construct real worktrees, so a
      # committer identity has to exist for the runner.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: Run every pytest scope
        run: python .claude/plugins/cla/run_tests.py -q

  node:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Not a pytest scope, so run_tests.py does not discover it. Without this
      # step it would only ever run when someone remembered to.
      - name: Run mechanical-checks suite
        run: node --test .claude/plugins/cla/skills/project-review/scripts/mechanical-checks.test.mjs

  hygiene:
    name: no SyntaxWarnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A regex in a non-raw docstring warned for a full day before anyone
      # compiled the file with warnings promoted to errors. Cheap to pin.
      - name: Compile every plugin module with warnings as errors
        run: |
          python -W error::SyntaxWarning - <<'PY'
          import py_compile, pathlib, sys
          bad = []
          for f in sorted(pathlib.Path('.claude/plugins/cla').rglob('*.py')):
              try:
                  py_compile.compile(str(f), doraise=True)
              except Exception as e:
                  bad.append(f"{f}: {type(e).__name__}: {e}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("clean")
          PY

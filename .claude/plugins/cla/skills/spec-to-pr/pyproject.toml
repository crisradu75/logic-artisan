# Pytest config for the spec-to-pr skill's test suite.
# Importability model: rely on `pythonpath = ["scripts"]` (namespace-package style).
# No __init__.py is required for cross-test imports under this layout.
# Add __init__.py only if a real Windows pytest collection issue surfaces.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

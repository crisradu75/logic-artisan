# Pytest config for the release skill's own scope.
#
# This scope and `tests/` must exist TOGETHER: `run_tests.py` treats a directory
# with a pytest-configured pyproject.toml and no `tests/` (or the reverse) as a
# near-miss and FAILS the whole run rather than skipping it.
#
# No `pythonpath`: the skill ships no scripts. The tests here assert the
# release PRECONDITIONS the SKILL.md prose promises, because the one step that
# prose cannot make safe is the irreversible one — a published tag.
[tool.pytest.ini_options]
testpaths = ["tests"]

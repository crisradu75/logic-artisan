# Pytest config for the plugin's conformance guards — not a skill (no SKILL.md)
# and not a guard hook, but a scope in the same shape as `consistency-checks/`:
# a pytest-configured pyproject.toml + tests/ so run_tests.py's discovery picks
# it up automatically, no runner changes needed.
#
# These two guards used to live in `skills/update-cla/tests/`, which made them
# hostage to a skill that is being deleted: they enforce the fact/procedure
# split and the cla.io path-staleness rule for the WHOLE plugin, and neither
# concern goes away when file-sync distribution does.
#
# No `pythonpath`: the tests import nothing from this scope. The one sibling
# import they had — `update-cla`'s `discover.SCAN_DIRS` — is now inlined, since
# the module it reached into is scheduled for deletion.

[tool.pytest.ini_options]
testpaths = ["tests"]

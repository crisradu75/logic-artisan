# Pytest config for the cla plugin's shared library — not a skill (no SKILL.md)
# and not a guard hook, but a scope in the same shape as `hooks/` and
# `consistency-checks/`: a pytest-configured pyproject.toml + tests/ so
# run_tests.py's discovery picks it up automatically, no runner changes needed.
#
# `pythonpath = ["."]` (not "scripts") because the modules sit at the scope
# root, matching `hooks/`.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

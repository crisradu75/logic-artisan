# Pytest config for the repo-root launcher scripts (`cla` and its `.cmd` twin). Not a skill and not a guard hook — like `consistency-checks/`,
# it is a home for checks that belong to no single scope. The launchers themselves
# live at the repo ROOT, outside the directory the marketplace publishes, so they
# never reach a consuming repo — but this scope does ship (it sits inside the
# published plugin dir), and its assertions are about source-repo files that a
# consumer has no reason to own. See TODO.md: shipped-but-source-only scopes.
#
# These scripts were previously the only executable surface with no test at all,
# and that gap shipped a real bug: `claw.cmd` passed the worktree name through
# to `claude` as an initial prompt, because `shift` does not affect `%*` in
# batch. A two-line argv assertion would have caught it.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
